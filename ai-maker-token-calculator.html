<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Maker 代幣試算</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<style>
/* Layout: one narrow card — controls on top, result band at the bottom */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --line:#d9dfe5; --fg:#1b2530; --muted:#5d6b78;
  --accent:#0f6b6f; --accent-soft:#e1f0ef;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e4e9ee; --muted:#93a1ae;
  --accent:#4fc1bf; --accent-soft:#16312f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --line:#2c3640; --fg:#e4e9ee; --muted:#93a1ae;
  --accent:#4fc1bf; --accent-soft:#16312f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-block:32px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:0 0 20px;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.controls{padding:22px 20px;display:grid;gap:22px}
.field{display:grid;gap:8px}
.label{font-weight:500}
.label .note{font-weight:400;font-size:.85rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:inherit;padding:10px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{width:100%;font:inherit;font-family:var(--f-num);padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-align:right}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details summary{cursor:pointer;color:var(--muted);font-size:.92rem}
details[open] summary{margin-bottom:12px}
details label{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center;font-size:.92rem}
.result{background:var(--accent-soft);border-top:1px solid var(--line);padding:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.result .k{font-size:.85rem;color:var(--muted)}
.total{font-family:var(--f-num);font-size:2.6rem;line-height:1.1;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.total small{font-family:var(--f-body);font-size:.95rem;font-weight:500;margin-left:6px}
.twd{text-align:right;color:var(--muted);font-size:.92rem}
.twd b{display:block;color:var(--fg);font-family:var(--f-num);font-size:1.1rem}
.hint{margin:12px 2px 0;color:var(--muted);font-size:.82rem}
</style>
</head>
<body>

<div class="wrap">
  <h1>AI Maker 代幣試算</h1>
  <div class="card">
    <div class="controls">
      <div class="field">
        <div class="label">模型</div>
        <div class="seg" id="models">
          <button type="button" data-m="yolo" aria-pressed="true">YOLO</button>
          <button type="button" data-m="tflite" aria-pressed="false">TFLite</button>
          <button type="button" data-m="sound" aria-pressed="false">Sound TFLite</button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="imgN"><span id="countLabel">圖片張數</span> <small class="note" id="sizeNote">（每張 1 MB）</small></label>
        <div class="row">
          <input type="range" id="imgR" min="0" max="5000" step="10" value="100" aria-label="張數滑桿">
          <input type="number" id="imgN" min="0" step="1" value="100">
        </div>
      </div>

      <div class="field">
        <label class="label" for="epN">訓練週期（epochs）</label>
        <div class="row">
          <input type="range" id="epR" min="1" max="500" step="1" value="300" aria-label="訓練週期滑桿">
          <input type="number" id="epN" min="1" step="1" value="300">
        </div>
      </div>

      <details>
        <summary>進階設定</summary>
        <label for="size"><span id="sizeLabel">每張圖片大小（MB）</span><input type="number" id="size" min="0" step="0.1" value="1"></label>
      </details>
    </div>

    <div class="result" aria-live="polite">
        <div class="k">預估費用</div>
        <div class="total"><span id="total">30</span><small>枚代幣</small></div>
    </div>
  </div>
  <p class="hint">試算結果僅供參考，實際以訓練前系統估價為準。訓練失敗會全額退回。</p>
</div>

<script>
const $=id=>document.getElementById(id);
const UNIT=0.001, K={yolo:1.0,tflite:0.5,sound:0.5};
let model="yolo";

function val(id,min){const v=parseFloat($(id).value);return isFinite(v)&&v>=min?v:min}
const fmt=x=>x.toLocaleString("zh-TW",{maximumFractionDigits:2});

function link(r,n){
  r.addEventListener("input",()=>{n.value=r.value;calc()});
  n.addEventListener("input",()=>{const v=parseFloat(n.value);if(isFinite(v))r.value=Math.min(v,+r.max);calc()});
}
link($("imgR"),$("imgN"));
link($("epR"),$("epN"));
$("size").addEventListener("input",calc);
$("models").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  model=b.dataset.m;
  document.querySelectorAll("#models button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  calc();
});

function calc(){
  const sound=model==="sound";
  $("countLabel").textContent=sound?"音檔數量":"圖片張數";
  $("sizeLabel").textContent=sound?"每個音檔大小（MB）":"每張圖片大小（MB）";
  const n=Math.floor(val("imgN",0)), ep=Math.floor(val("epN",1)), size=val("size",0);
  $("sizeNote").textContent=`（每${sound?"個":"張"} ${fmt(size)} MB）`;
  const mb=Math.floor(n*size+1e-9);
  const total=Math.max(Math.round((mb*ep*UNIT*K[model]+Number.EPSILON)*100)/100,1);
  $("total").textContent=fmt(total);
}
calc();
</script>
</body>
</html>
